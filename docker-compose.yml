version: '3.8'
services:
  module-api:
    image: intheeast0305/module-api:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: always

  module-hello:
    image: intheeast0305/module-hello:latest
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: always